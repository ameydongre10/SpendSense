services:
  - type: web
    name: spendsense-api
    runtime: python
    buildCommand: "pip install -r requirements-ml.txt"
    startCommand: "python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: spendsense-db
          property: connectionString

databases:
  - name: spendsense-db
    plan: free
    databaseName: spendsense
    user: spendsense_user
